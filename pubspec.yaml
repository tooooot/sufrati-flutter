name: sufrati
description: "سفرتي — متابعة غذائية للبيت: المريض والطباخ والطبيب"
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: ^3.13.5

dependencies:
  adhan: ^2.0.0+1
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^16.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/programs/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
