name: sufrati
description: "سفرتي — متابعة غذائية للبيت: المريض والطباخ والطبيب"
publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: ^3.13.5

dependencies:
  adhan: ^2.0.0+1
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^16.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sign_in_with_apple: ^8.2.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/programs/
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
