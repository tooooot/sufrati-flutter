name: Web (موقع التجربة)

# يبني موقع التجربة (Flutter Web) ليُنشَر على https://maeda.wardyat.net/preview/ — دخول حقيقي على Firebase.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run --base-href /preview/
      - uses: actions/upload-artifact@v4
        with:
          name: sufrati-web
          path: build/web
          retention-days: 7
