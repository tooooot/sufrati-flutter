name: Android AAB (سفرتي Flutter)

# الأسرار المطلوبة في الريبو (Settings ← Secrets and variables ← Actions):
#   ANDROID_KEYSTORE_B64   محتوى upload.jks بصيغة base64
#   ANDROID_STORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
# المخرجات: ملف app-release.aab في Artifacts (يُحمَّل ثم يُرفع لـPlay/Internal App Sharing).
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'شغّل الاختبارات قبل البناء'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Generate native project
        run: |
          flutter create --platforms=android --org net.wardyat --project-name sufrati .
          rm -f test/widget_test.dart   # قالب flutter create يشير لـMyApp غير الموجود
          python3 tools/prepare_native.py android
          flutter pub get
      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: flutter test
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/android/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/upload.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
      - name: Build AAB
        # رقم النسخة يزيد تلقائياً مع كل تشغيل (أعلى من ٥ المرفوعة سابقاً)
        run: flutter build appbundle --release --build-number=$((10 + ${{ github.run_number }}))
      - name: Build APK
        run: flutter build apk --release --build-number=$((10 + ${{ github.run_number }}))
      - name: Verify signature (must be the upload key)
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "SHA1|SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: sufrati-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sufrati-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
      - name: Remove key
        if: always()
        run: rm -f android/upload.jks android/key.properties
